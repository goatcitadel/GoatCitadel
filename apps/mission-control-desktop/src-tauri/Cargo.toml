[package]
name = "goatcitadel-mission-control-desktop"
version = "1.0.0"
description = "Native desktop host for GoatCitadel Mission Control"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.1", features = ["tray-icon"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2.4.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
