<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoatCitadel Mission Control</title>
  </head>
  <body>
    <div id="app">
      <section id="startup" class="desktop-shell" aria-labelledby="startup-heading">
        <div class="status-panel">
          <div class="brand-row">
            <span class="brand-mark" aria-hidden="true"></span>
            <div>
              <p class="eyebrow">GoatCitadel</p>
              <h1 id="startup-heading">Mission Control</h1>
            </div>
          </div>
          <p id="status-copy" class="status-copy" role="status" aria-live="polite">Starting the local runtime...</p>
          <div class="progress-track" aria-hidden="true"><span id="progress-bar" class="is-starting"></span></div>
          <details class="runtime-details">
            <summary>Runtime details</summary>
            <div id="runtime-meta" class="runtime-meta"></div>
          </details>
          <div id="recovery-actions" class="actions is-hidden">
            <button id="retry-button" type="button">Retry</button>
            <button id="open-browser-button" type="button">Open in Browser</button>
            <button id="open-logs-button" type="button">Open Logs</button>
            <button id="open-folder-button" type="button">Open Install Folder</button>
          </div>
        </div>
      </section>
      <div id="desktop-toast" class="desktop-toast is-hidden" role="status" aria-live="polite"></div>
      <iframe id="mission-control-frame" title="Mission Control" class="mission-control-frame"></iframe>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
