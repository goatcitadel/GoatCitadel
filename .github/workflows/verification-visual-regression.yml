name: Verification Visual Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/mission-control/**"
      - "apps/gateway/**"
      - "scripts/verification/**"
      - ".github/workflows/verification-visual-regression.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - "apps/mission-control/**"
      - "apps/gateway/**"
      - "scripts/verification/**"
      - ".github/workflows/verification-visual-regression.yml"
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.31.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run visual-regression verification
        run: pnpm verify:visual:regression

      - name: Run review generation
        if: always()
        run: pnpm verify:review

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-visual-regression-artifacts
          path: artifacts/verification
          if-no-files-found: ignore
