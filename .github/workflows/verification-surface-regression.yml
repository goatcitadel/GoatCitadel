name: Verification Surface Regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surface-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run surface-regression verification
        env:
          GOATCITADEL_UI_PACKAGE: "@goatcitadel/mission-control-next"
        run: pnpm verify:surface:regression

      - name: Run review generation
        if: always()
        run: pnpm verify:review

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-surface-regression-artifacts
          path: artifacts/verification
          if-no-files-found: ignore
