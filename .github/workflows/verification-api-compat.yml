name: Verification API Compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/gateway/**"
      - "packages/contracts/**"
      - "scripts/verification/**"
      - ".github/workflows/verification-api-compat.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - "apps/gateway/**"
      - "packages/contracts/**"
      - "scripts/verification/**"
      - ".github/workflows/verification-api-compat.yml"
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  api-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API compatibility verification
        run: pnpm verify:api:compat

      - name: Run review generation
        if: always()
        run: pnpm verify:review

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-api-compat-artifacts
          path: artifacts/verification
          if-no-files-found: ignore
