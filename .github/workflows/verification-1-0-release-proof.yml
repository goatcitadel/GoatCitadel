name: Verification 1.0 Release Proof

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  required-lanes:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - laneScript: verify:runtime:truth
            artifactSlug: runtime-truth
            runner: ubuntu-latest
          - laneScript: verify:auth:matrix
            artifactSlug: auth-matrix
            runner: ubuntu-latest
          - laneScript: verify:code-mode:sandbox
            artifactSlug: code-mode-sandbox
            runner: ubuntu-latest
          - laneScript: verify:code-mode:hostile-sandbox
            artifactSlug: code-mode-hostile-sandbox
            runner: windows-latest
          - laneScript: verify:mesh:readiness
            artifactSlug: mesh-readiness
            runner: ubuntu-latest
          - laneScript: verify:agentic:governance
            artifactSlug: agentic-governance
            runner: ubuntu-latest
          - laneScript: verify:agentic:proof
            artifactSlug: agentic-proof
            runner: ubuntu-latest
          - laneScript: verify:ui:parity
            artifactSlug: ui-parity
            runner: ubuntu-latest
          - laneScript: verify:memory:truth
            artifactSlug: memory-truth
            runner: ubuntu-latest
          - laneScript: verify:realtime:truth
            artifactSlug: realtime-truth
            runner: ubuntu-latest
          - laneScript: verify:architecture:metrics
            artifactSlug: architecture-metrics
            runner: ubuntu-latest
          - laneScript: verify:operator:proof
            artifactSlug: operator-proof
            runner: ubuntu-latest
          - laneScript: verify:durable:recovery
            artifactSlug: durable-recovery
            runner: ubuntu-latest
          - laneScript: verify:surface:regression
            artifactSlug: surface-regression
            runner: ubuntu-latest
          - laneScript: verify:visual:regression
            artifactSlug: visual-regression
            runner: ubuntu-latest
          - laneScript: verify:backup:roundtrip
            artifactSlug: backup-roundtrip
            runner: ubuntu-latest
          - laneScript: verify:catalog:parity
            artifactSlug: catalog-parity
            runner: ubuntu-latest
          - laneScript: verify:api:compat
            artifactSlug: api-compat
            runner: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Code-mode sandbox proofs spawn a child gateway `tsx` that resolves @goatcitadel/*
      # via node_modules -> dist (no tsconfig path mappings, no prepare build). Build the
      # gateway's workspace dependencies so those lanes can resolve them on a clean runner.
      - name: Build workspace dependencies
        run: pnpm --filter "@goatcitadel/gateway^..." build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run release proof lane
        env:
          GOATCITADEL_UI_PACKAGE: "@goatcitadel/mission-control-next"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: pnpm "${{ matrix.laneScript }}"

      - name: Run review generation
        if: always()
        run: pnpm verify:review

      - name: Verify artifact redaction
        id: artifact-redaction
        if: always()
        run: pnpm verify:artifacts:redaction

      - name: Upload verification artifacts
        if: always() && steps.artifact-redaction.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: verification-release-proof-${{ matrix.artifactSlug }}-artifacts
          path: artifacts/verification
          if-no-files-found: error

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy security gate
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: >-
            .git,.codex-tmp,.turbo,.worktrees,node_modules,tmp,artifacts,
            apps/gateway/backups,apps/gateway/coverage,apps/gateway/coverage-exercise,
            apps/gateway/coverage-smoke,apps/gateway/dist,
            apps/mission-control-desktop/src-tauri/target,
            apps/mission-control-next/coverage,
            apps/mission-control-next/dist,data/audit,data/transcripts
          timeout: 15m
          severity: HIGH,CRITICAL
          exit-code: "1"
