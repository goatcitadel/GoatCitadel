name: Security Trivy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: >-
            .git,.codex-tmp,.turbo,.worktrees,node_modules,tmp,artifacts,
            apps/gateway/backups,apps/gateway/coverage,apps/gateway/coverage-exercise,
            apps/gateway/coverage-smoke,apps/gateway/dist,
            apps/mission-control-desktop/src-tauri/target,
            apps/mission-control-next/coverage,
            apps/mission-control-next/dist,data/audit,data/transcripts
          timeout: 15m
          severity: HIGH,CRITICAL
          exit-code: "1"
