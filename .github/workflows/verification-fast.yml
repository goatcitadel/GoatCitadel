name: Verification Fast

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The lane used to run as one serial job that outgrew its 45-minute budget and was
# killed mid-run. Its work is now spread across jobs that run at the same time: the
# non-test checks, the three test slices, and the real-Postgres lanes all finish
# independently, and `gate` recomposes them. Each slice records its own partial
# verification manifest; merge-fast-manifests.mjs fails closed if the union of those
# parts does not cover every command the lane defines, so a dropped job cannot pass
# as a green run that quietly skipped checks.
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Storage migration lineage compares the candidate manifest with the
          # immutable PR/push base object, so that object must be available.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go for actionlint
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify workflow and PowerShell syntax
        run: pnpm verify:workflows

      - name: Run fast verification checks
        env:
          GOATCITADEL_STORAGE_MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/main' && github.event.before) || '' }}
        run: >-
          pnpm verify:fast --commands=fast.skills-catalog,fast.repo-hygiene,fast.gateway-async-boundary,fast.storage-migration-parity,fast.extensions-sdk-build,fast.extensions-sdk-package,fast.typecheck,fast.coverage.gateway.smoke,fast.coverage.gateway.exercise,fast.smoke,fast.build,fast.docs

      - name: Stage checks part
        if: always()
        run: bash scripts/verification/stage-fast-part.sh part

      - name: Upload checks part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-fast-part-checks
          path: part
          if-no-files-found: error

  tests:
    name: Tests (${{ matrix.slice }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The gateway suite is 860 files and was the lane's longest scenario.
          # vitest --shard splits it; each shard writes its own coverage directory
          # and the gate merges them. The two node-runner files ride with shard 4.
          - slice: gateway-1
            commands: fast.test.gateway.shard1
          - slice: gateway-2
            commands: fast.test.gateway.shard2
          - slice: gateway-3
            commands: fast.test.gateway.shard3
          - slice: gateway-4
            commands: fast.test.gateway.shard4,fast.test.gateway.node
          - slice: storage
            commands: fast.test.storage
          - slice: ui
            commands: fast.test.mission-control-next,fast.test.policy-engine,fast.test.libraries
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The single-job lane built the workspace as fast.typecheck before any suite
      # ran. That scenario is recorded once, by the checks job, so each test slice
      # reproduces the build here rather than re-running the scenario.
      - name: Build workspace
        run: pnpm typecheck

      - name: Install Playwright Chromium
        if: matrix.slice == 'ui'
        run: pnpm exec playwright install chromium

      - name: Run fast verification tests
        run: pnpm verify:fast --commands=${{ matrix.commands }}

      - name: Stage tests part
        if: always()
        run: bash scripts/verification/stage-fast-part.sh part

      - name: Upload tests part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-fast-part-tests-${{ matrix.slice }}
          path: part
          if-no-files-found: error

  postgres:
    name: Real Postgres lanes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: goatcitadel_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d goatcitadel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GOATCITADEL_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/goatcitadel_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The single-job lane had already built the workspace as fast.typecheck before
      # these lanes ran. On its own the storage lane only builds @goatcitadel/storage,
      # so the Gateway services these tests reach import `@goatcitadel/skills/dist`
      # from a package nobody compiled. Build the workspace first, as the test slices do.
      - name: Build workspace
        run: pnpm typecheck

      - name: Run real Postgres storage lane
        run: pnpm --filter @goatcitadel/storage test:postgres

      - name: Run real Postgres Gateway auth lane
        run: pnpm --filter @goatcitadel/gateway test:postgres:auth

      - name: Run real Postgres Gateway memory lifecycle lane
        run: pnpm --filter @goatcitadel/gateway test:postgres:memory

  bundled-postgres-restart:
    name: Bundled Postgres stopped-container restart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Confirm Docker availability
        run: docker info

      - name: Prove stopped bundled Postgres recovery
        run: pnpm verify:bundled-postgres:restart

  gate:
    # Keep this exact name aligned with the protected-branch required context.
    # `always()` is required because a skipped required job reports success on
    # GitHub; the final step below converts every failed/skipped dependency to a
    # failing aggregate check.
    name: fast
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [checks, tests, postgres, bundled-postgres-restart]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore verification parts
        uses: actions/download-artifact@v4
        with:
          pattern: verification-fast-part-*
          path: parts

      - name: Restore coverage reports
        run: |
          # Each part carries the coverage its slice produced under part/coverage/,
          # mirroring the workspace layout; copy it back so coverage:collect:reuse
          # finds the reports where the packages would have written them.
          for part in parts/*/; do
            if [ -d "${part}coverage" ]; then
              cp -r "${part}coverage/." .
            fi
          done
          # Reuse rejects a report older than the sources it measures, which is what
          # protects a stale local re-run. Across jobs that comparison is meaningless:
          # every job in this run checked out the same commit, and the restored files
          # carry mtimes from another machine. Re-stamp them so the freshness check
          # measures what it can actually see.
          find apps packages -type f -path '*/coverage*/coverage-final.json' -exec touch {} +
          find apps packages -type f -path '*/coverage*/coverage-final.json' -print

      - name: Merge verification manifests
        run: node scripts/verification/merge-fast-manifests.mjs parts --out=artifacts/verification/merged

      - name: Enforce production coverage gate
        run: pnpm coverage:collect:reuse && pnpm coverage:gate:production

      - name: Verify artifact redaction
        id: artifact-redaction
        if: always()
        run: |
          pnpm verify:artifacts:redaction
          node scripts/verify-artifact-redaction.mjs artifacts/coverage

      - name: Upload verification artifacts
        if: always() && steps.artifact-redaction.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: verification-fast-artifacts
          path: |
            artifacts/verification
            artifacts/coverage/coverage-summary.json
            artifacts/coverage/coverage-summary.md
          if-no-files-found: error

      - name: Enforce upstream job results
        if: always()
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          BUNDLED_POSTGRES_RESTART_RESULT: ${{ needs.bundled-postgres-restart.result }}
        run: |
          if [ "$CHECKS_RESULT" != "success" ] || [ "$TESTS_RESULT" != "success" ] || [ "$POSTGRES_RESULT" != "success" ] || [ "$BUNDLED_POSTGRES_RESTART_RESULT" != "success" ]; then
            echo "One or more required verification jobs did not succeed: checks=$CHECKS_RESULT tests=$TESTS_RESULT postgres=$POSTGRES_RESULT bundled-postgres-restart=$BUNDLED_POSTGRES_RESTART_RESULT" >&2
            exit 1
          fi
