name: Verification Fast

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    # The job bailed at the first failing step for a long time, so it never paid the
    # cost of its later steps (real Postgres lane, production coverage gate). With
    # those running end to end it now exceeds 45 minutes and is killed mid-run —
    # "The operation was canceled" at 45m12s, not a failing assertion. Raise the
    # budget so the completed pipeline can report. The durable fix is to split the
    # independent steps into parallel jobs, which also stops a red step from hiding
    # the ones behind it.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: goatcitadel_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d goatcitadel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go for actionlint
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify workflow and PowerShell syntax
        run: pnpm verify:workflows

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      # ESLint and the root typecheck run in code-quality.yml, and the lane itself
      # runs docs:check as fast.docs — duplicating them here only lengthened the
      # critical path and blurred which gate owns each check.
      - name: Run fast verification
        run: pnpm verify:fast

      - name: Run real Postgres storage lane
        env:
          GOATCITADEL_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/goatcitadel_test
        run: pnpm --filter @goatcitadel/storage test:postgres

      - name: Run real Postgres Gateway auth lane
        env:
          GOATCITADEL_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/goatcitadel_test
        run: pnpm --filter @goatcitadel/gateway test:postgres:auth

      - name: Run real Postgres Gateway memory lifecycle lane
        env:
          GOATCITADEL_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/goatcitadel_test
        run: pnpm --filter @goatcitadel/gateway test:postgres:memory

      # `pnpm verify:fast` already ran every package's test:coverage script, so the
      # gate aggregates those reports instead of executing the whole suite a second
      # time. These two c8 reports are the only collection work the lane does not do.
      - name: Collect gateway coverage extras
        run: |
          pnpm --filter @goatcitadel/gateway coverage:smoke
          pnpm --filter @goatcitadel/gateway coverage:exercise

      - name: Enforce production coverage gate
        run: pnpm coverage:collect:reuse && pnpm coverage:gate:production

      - name: Verify artifact redaction
        id: artifact-redaction
        if: always()
        run: |
          pnpm verify:artifacts:redaction
          node scripts/verify-artifact-redaction.mjs artifacts/coverage

      - name: Upload verification artifacts
        if: always() && steps.artifact-redaction.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: verification-fast-artifacts
          path: |
            artifacts/verification
            artifacts/coverage/coverage-summary.json
            artifacts/coverage/coverage-summary.md
          if-no-files-found: error
