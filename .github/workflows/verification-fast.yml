name: Verification Fast

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: goatcitadel_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d goatcitadel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go for actionlint
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify workflow and PowerShell syntax
        run: pnpm verify:workflows

      - name: Run ESLint
        run: pnpm lint --max-warnings 0

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run docs checks
        run: pnpm docs:check

      - name: Run fast verification
        run: pnpm verify:fast

      - name: Run real Postgres storage lane
        env:
          GOATCITADEL_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/goatcitadel_test
        run: pnpm --filter @goatcitadel/storage test:postgres

      - name: Enforce production coverage gate
        run: pnpm coverage:collect && pnpm coverage:gate:production

      - name: Verify artifact redaction
        id: artifact-redaction
        if: always()
        run: pnpm verify:artifacts:redaction

      - name: Upload verification artifacts
        if: always() && steps.artifact-redaction.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: verification-fast-artifacts
          path: artifacts/verification
          if-no-files-found: error
