name: Verification Operator Proof

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "docs/1_0_CONTRACT.md"
      - "docs/1_0_RELEASE_EVIDENCE.md"
      - "docs/CANONICAL_RUNTIME_STATE_MODEL.md"
      - "docs/ENGINEERING_HANDBOOK.md"
      - "scripts/verification/**"
      - "scripts/verify-artifact-redaction.mjs"
      - "scripts/verify-artifact-redaction.test.mjs"
      - ".github/workflows/verification-operator-proof.yml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "docs/1_0_CONTRACT.md"
      - "docs/1_0_RELEASE_EVIDENCE.md"
      - "docs/CANONICAL_RUNTIME_STATE_MODEL.md"
      - "docs/ENGINEERING_HANDBOOK.md"
      - "scripts/verification/**"
      - "scripts/verify-artifact-redaction.mjs"
      - "scripts/verify-artifact-redaction.test.mjs"
      - ".github/workflows/verification-operator-proof.yml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  operator-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run operator-proof verification
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: pnpm verify:operator:proof

      - name: Run review generation
        if: always()
        run: pnpm verify:review

      - name: Verify artifact redaction
        id: artifact-redaction
        if: always()
        run: pnpm verify:artifacts:redaction

      - name: Upload verification artifacts
        if: always() && steps.artifact-redaction.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: verification-operator-proof-artifacts
          path: artifacts/verification
          if-no-files-found: ignore
