name: Verification Agentic and Code Mode

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/gateway/**"
      - "apps/mission-control-next/**"
      - "packages/**"
      - "scripts/verification/**"
      - ".github/workflows/verification-agentic-code-mode.yml"
      - "docs/1_0_CONTRACT.md"
      - "docs/1_0_RELEASE_EVIDENCE.md"
      - "docs/CAPABILITY_SYSTEM_V1.md"
      - "docs/CANONICAL_RUNTIME_STATE_MODEL.md"
      - "docs/COWORK_CODE_BOUNDARIES.md"
      - "docs/HARNESS_AUDIT_LENS.md"
      - "docs/review/HERMES_GOATCITADEL_PARITY_AUDIT_2026-05-02.md"
      - "goatcitadel_prompt_pack_v4_agentic_focused.md"
      - "AGENTS.md"
      - "README.md"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "apps/gateway/**"
      - "apps/mission-control-next/**"
      - "packages/**"
      - "scripts/verification/**"
      - ".github/workflows/verification-agentic-code-mode.yml"
      - "docs/1_0_CONTRACT.md"
      - "docs/1_0_RELEASE_EVIDENCE.md"
      - "docs/CAPABILITY_SYSTEM_V1.md"
      - "docs/CANONICAL_RUNTIME_STATE_MODEL.md"
      - "docs/COWORK_CODE_BOUNDARIES.md"
      - "docs/HARNESS_AUDIT_LENS.md"
      - "docs/review/HERMES_GOATCITADEL_PARITY_AUDIT_2026-05-02.md"
      - "goatcitadel_prompt_pack_v4_agentic_focused.md"
      - "AGENTS.md"
      - "README.md"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  agentic-code-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - laneScript: verify:code-mode:sandbox
            artifactSlug: code-mode-sandbox
          - laneScript: verify:agentic:governance
            artifactSlug: agentic-governance
          - laneScript: verify:agentic:proof
            artifactSlug: agentic-proof
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run verification lane
        env:
          GOATCITADEL_UI_PACKAGE: "@goatcitadel/mission-control-next"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: pnpm "${{ matrix.laneScript }}"

      - name: Run review generation
        if: always()
        run: pnpm verify:review

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.artifactSlug }}-artifacts
          path: artifacts/verification
          if-no-files-found: ignore
