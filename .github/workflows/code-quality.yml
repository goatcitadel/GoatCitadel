name: Code Quality

# Always-on code quality gate. The richer "Verification Fast" workflow (which carried
# both ESLint and TypeScript validation) is disabled, so neither lint nor typecheck was
# running on push/PR anywhere; this restores both as a fast, dependency-light required
# check on every change. `pnpm lint` is ESLint; `pnpm typecheck` runs `tsc -b` across
# every workspace package (the TS lane is separate from ESLint in this repo).

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint --max-warnings 0

      - name: Run typecheck
        run: pnpm typecheck

      - name: Mission Control Next CSS guards
        run: |
          node --test scripts/check-mission-control-next-typography.test.mjs
          node scripts/check-mission-control-next-typography.mjs
          node scripts/check-mission-control-next-token-drift.mjs
          node --test scripts/check-mission-control-next-contrast.test.mjs
          node scripts/check-mission-control-next-contrast.mjs
