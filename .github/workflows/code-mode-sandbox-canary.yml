name: Code Mode Sandbox Canary

# Dedicated required gate for the Code Mode host-isolation posture and the
# hostile-code adversarial canary suite. Promoting these lanes to their own gate
# (rather than only running inside verify:fast) keeps the sandbox claim-gating
# logic and adapter posture from silently regressing as Code Mode traffic grows.
on:
  push:
    branches:
      - main
    paths:
      - "apps/gateway/src/services/code-mode-sandbox/**"
      - "apps/gateway/src/services/code-mode-docker-launch.ts"
      - "apps/gateway/src/code-mode-hostile-sandbox-proof.ts"
      - "scripts/verification/lib/scenarios.mjs"
      - "packages/contracts/src/capabilities.ts"
      - ".github/workflows/code-mode-sandbox-canary.yml"
  pull_request:
    paths:
      - "apps/gateway/src/services/code-mode-sandbox/**"
      - "apps/gateway/src/services/code-mode-docker-launch.ts"
      - "apps/gateway/src/code-mode-hostile-sandbox-proof.ts"
      - "scripts/verification/lib/scenarios.mjs"
      - "packages/contracts/src/capabilities.ts"
      - ".github/workflows/code-mode-sandbox-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-mode-sandbox-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Code Mode required-sandbox lane
        run: pnpm verify:code-mode:sandbox

      - name: Run Code Mode hostile-sandbox canary lane
        run: pnpm verify:code-mode:hostile-sandbox

      - name: Upload sandbox proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-mode-sandbox-canary-artifacts
          path: artifacts/verification
          if-no-files-found: error
