name: Release Windows Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (for example v1.0.0)"
        required: true
        type: string
      allow_unsigned:
        description: "Allow unsigned development artifacts. Must stay false for public releases."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  actions: read
  contents: write
  id-token: write

env:
  PNPM_VERSION: 10.31.0
  NODE_VERSION: 22

jobs:
  windows:
    runs-on: ${{ matrix.runner }}
    env:
      WINDOWS_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
      WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
          - target: windows-arm64
            runner: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        run: rustup default stable-msvc

      - name: Check desktop Rust crate
        working-directory: apps/mission-control-desktop/src-tauri
        run: cargo check

      - name: Test desktop Rust crate
        working-directory: apps/mission-control-desktop/src-tauri
        run: cargo test

      - name: Build desktop executable
        run: pnpm package:desktop --target ${{ matrix.target }}

      - name: Require signing secrets for public releases
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.allow_unsigned != 'true') && (env.WINDOWS_SIGN_CERT_BASE64 == '' || env.WINDOWS_SIGN_CERT_PASSWORD == '') }}
        run: |
          echo "WINDOWS_SIGN_CERT_BASE64 and WINDOWS_SIGN_CERT_PASSWORD are required for public release installers."
          exit 1

      - name: Sign desktop executable
        if: ${{ env.WINDOWS_SIGN_CERT_BASE64 != '' && env.WINDOWS_SIGN_CERT_PASSWORD != '' }}
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "goatcitadel-signing-cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:WINDOWS_SIGN_CERT_BASE64))
          $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
          & $signtool sign /fd SHA256 /f $certPath /p $env:WINDOWS_SIGN_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "artifacts/installers/desktop/${{ matrix.target }}/GoatCitadel-Mission-Control-Desktop.exe"
          & $signtool verify /pa "artifacts/installers/desktop/${{ matrix.target }}/GoatCitadel-Mission-Control-Desktop.exe"
          Remove-Item -LiteralPath $certPath -Force

      - name: Build packaged bundle
        run: pnpm package:bundle --target ${{ matrix.target }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        run: pnpm package:windows --target ${{ matrix.target }}

      - name: Sign Windows installer
        if: ${{ env.WINDOWS_SIGN_CERT_BASE64 != '' && env.WINDOWS_SIGN_CERT_PASSWORD != '' }}
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "goatcitadel-signing-cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:WINDOWS_SIGN_CERT_BASE64))
          $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
          & $signtool sign /fd SHA256 /f $certPath /p $env:WINDOWS_SIGN_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "artifacts/installers/windows/GoatCitadel-Setup-${{ matrix.target }}.exe"
          & $signtool verify /pa "artifacts/installers/windows/GoatCitadel-Setup-${{ matrix.target }}.exe"
          Remove-Item -LiteralPath $certPath -Force

      - name: Smoke install Windows installer
        shell: pwsh
        run: |
          $installer = Resolve-Path "artifacts/installers/windows/GoatCitadel-Setup-${{ matrix.target }}.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "GoatCitadel-${{ matrix.target }}"
          $install = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          $desktop = Join-Path $installDir "app/desktop/GoatCitadel-Mission-Control-Desktop.exe"
          if (!(Test-Path $desktop)) { throw "Installed desktop executable was not found at $desktop" }
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (Test-Path $uninstaller) {
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)" }
          }
          if (Test-Path $desktop) { throw "Installed desktop executable remained after uninstall at $desktop" }
          if (Test-Path $installDir) {
            $remaining = Get-ChildItem -LiteralPath $installDir -Force -ErrorAction SilentlyContinue
            if ($remaining) {
              $sample = ($remaining | Select-Object -First 5 -ExpandProperty FullName) -join "`n"
              throw "Installer left files after uninstall in $installDir`n$sample"
            }
          }

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $installer = "artifacts/installers/windows/GoatCitadel-Setup-${{ matrix.target }}.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          Set-Content -Path "$installer.sha256" -Value "$hash *$(Split-Path $installer -Leaf)"

      - name: Upload unsigned Windows package smoke assets
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.allow_unsigned == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-unsigned-package-smoke-assets
          path: |
            artifacts/installers/windows/GoatCitadel-Setup-${{ matrix.target }}.exe
            artifacts/installers/windows/GoatCitadel-Setup-${{ matrix.target }}.exe.sha256

      - name: Upload Windows release assets
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.allow_unsigned != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-release-assets
          path: |
            artifacts/installers/windows/GoatCitadel-Setup-${{ matrix.target }}.exe
            artifacts/installers/windows/GoatCitadel-Setup-${{ matrix.target }}.exe.sha256

  release:
    runs-on: ubuntu-latest
    needs: windows
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.allow_unsigned != 'true' }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Verify release artifact matrix
        run: |
          test -f release-artifacts/windows-x64-release-assets/GoatCitadel-Setup-windows-x64.exe
          test -f release-artifacts/windows-x64-release-assets/GoatCitadel-Setup-windows-x64.exe.sha256
          test -f release-artifacts/windows-arm64-release-assets/GoatCitadel-Setup-windows-arm64.exe
          test -f release-artifacts/windows-arm64-release-assets/GoatCitadel-Setup-windows-arm64.exe.sha256

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p artifacts/release
          pnpm dlx @cyclonedx/cyclonedx-npm --output-format json --output-file "artifacts/release/goatcitadel-${RELEASE_TAG}.cyclonedx.json"

      - name: Sign release artifacts
        run: node scripts/release/sign-release-artifacts.mjs --artifacts-dir release-artifacts

      - name: Assemble release proof ZIP
        run: |
          node scripts/release/assemble-release-package.mjs \
            --version "$RELEASE_TAG" \
            --tag "$RELEASE_TAG" \
            --artifacts-dir release-artifacts \
            --sbom-file "artifacts/release/goatcitadel-${RELEASE_TAG}.cyclonedx.json"

      - name: Wait for 1.0 release proof
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release/wait-for-release-proof.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"

      - name: Write commit-bound release certificate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release/write-release-certificate.mjs \
            --version "$RELEASE_TAG" \
            --tag "$RELEASE_TAG" \
            --artifacts-dir release-artifacts \
            --proof-zip "artifacts/release/package/GoatCitadel-${RELEASE_TAG}-release-package.zip" \
            --out-file artifacts/release/release-certificate.json \
            --require-success

      - name: Upload release proof bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-proof-${{ env.RELEASE_TAG }}
          path: |
            artifacts/release/goatcitadel-${{ env.RELEASE_TAG }}.cyclonedx.json
            artifacts/release/package/*.zip
            artifacts/release/release-certificate.json

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-artifacts/**/*
            artifacts/release/goatcitadel-${{ env.RELEASE_TAG }}.cyclonedx.json
            artifacts/release/package/*.zip
            artifacts/release/release-certificate.json
