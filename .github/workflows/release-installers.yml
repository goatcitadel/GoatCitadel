name: x64 PostgreSQL Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PREVIEW_COMMIT: 3c83cb34729aba9fc35a8ab03ac3b65632498897
      PREVIEW_TARGET: windows-x64
      PREVIEW_VERSION: "0.9.8-x64.1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.PREVIEW_COMMIT }}
          persist-credentials: false
      - name: Verify source identity
        run: |
          if ((git rev-parse HEAD) -cne $env:PREVIEW_COMMIT -or (git status --porcelain)) { throw "Unexpected source checkout." }
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 10.31.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.300
      - run: pnpm install --frozen-lockfile
      - name: Verify x64 desktop
        run: |
          if ((node -p "process.arch") -cne "x64") { throw "Expected x64 Node." }
          rustup toolchain install "1.94.0" --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default "1.94.0"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm verify:desktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test scripts/packaging/windows-installer-smoke-contract.test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build versioned x64 bundle from exact source
        run: |
          $env:GITHUB_SHA = $env:PREVIEW_COMMIT
          pnpm package:windows-host --target $env:PREVIEW_TARGET
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm package:windows-msix --allow-unsigned
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm package:bundle --target $env:PREVIEW_TARGET --version $env:PREVIEW_VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build unsigned installer with pinned Inno Setup
        run: |
          $inno = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $inno
          if ((Get-FileHash -LiteralPath $inno -Algorithm SHA256).Hash.ToLowerInvariant() -cne "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732") { throw "Inno Setup checksum mismatch." }
          $result = Start-Process -FilePath $inno -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-') -WindowStyle Hidden -Wait -PassThru
          if ($result.ExitCode) { throw "Inno Setup failed." }
          pnpm package:windows --target $env:PREVIEW_TARGET --version $env:PREVIEW_VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Smoke test clean install and bundled PostgreSQL recovery
        timeout-minutes: 30
        run: |
          & ./scripts/packaging/smoke-windows-installer.ps1 -InstallerPath "artifacts/installers/windows/GoatCitadel-Setup-windows-x64.exe" -ExpectedReleaseManifestPath "artifacts/installers/bundles/GoatCitadel-$env:PREVIEW_VERSION-windows-x64/app/release-manifest.json" -Target windows-x64 -TrustMode unsigned
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify and stage installer
        run: |
          $manifestPath = "artifacts/installers/bundles/GoatCitadel-$env:PREVIEW_VERSION-windows-x64/app/release-manifest.json"
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.version -cne $env:PREVIEW_VERSION -or $manifest.sourceCommit -cne $env:PREVIEW_COMMIT -or $manifest.sourceModified -ne $false -or $manifest.target -cne $env:PREVIEW_TARGET) { throw "Unexpected installer manifest." }
          $name = "GoatCitadel-Setup-windows-x64.exe"
          $installer = "artifacts/installers/windows/$name"
          if ((Get-AuthenticodeSignature -LiteralPath $installer).Status -ne "NotSigned") { throw "Expected unsigned preview." }
          $stage = "artifacts/x64-startup-preview"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -LiteralPath $installer, $manifestPath -Destination $stage
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$stage/$name.sha256" -Value "$hash *$name" -Encoding utf8NoBOM
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: x64-startup-preview
          path: artifacts/x64-startup-preview/
          if-no-files-found: error
          retention-days: 7
