name: Release Windows Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (for example v1.0.0)"
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write

env:
  PNPM_VERSION: 10.31.0
  NODE_VERSION: 24

jobs:
  windows:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
          - target: windows-arm64
            runner: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        run: rustup default stable-msvc

      - name: Build desktop executable
        run: pnpm package:desktop --target ${{ matrix.target }}

      - name: Sign desktop executable
        if: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 != '' && secrets.WINDOWS_SIGN_CERT_PASSWORD != '' }}
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "goatcitadel-signing-cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String("${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}"))
          $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
          & $signtool sign /fd SHA256 /f $certPath /p "${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}" /tr http://timestamp.digicert.com /td SHA256 "artifacts/installers/desktop/${{ matrix.target }}/GoatCitadel-Mission-Control-Desktop.exe"

      - name: Build packaged bundle
        run: pnpm package:bundle --target ${{ matrix.target }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        run: pnpm package:windows --target ${{ matrix.target }}

      - name: Sign Windows installer
        if: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 != '' && secrets.WINDOWS_SIGN_CERT_PASSWORD != '' }}
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "goatcitadel-signing-cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String("${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}"))
          $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
          & $signtool sign /fd SHA256 /f $certPath /p "${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}" /tr http://timestamp.digicert.com /td SHA256 "artifacts/installers/windows/GoatCitadel-Setup-${{ matrix.target }}.exe"

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $installer = "artifacts/installers/windows/GoatCitadel-Setup-${{ matrix.target }}.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          Set-Content -Path "$installer.sha256" -Value "$hash *$(Split-Path $installer -Leaf)"

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-release-assets
          path: |
            artifacts/installers/windows/GoatCitadel-Setup-${{ matrix.target }}.exe
            artifacts/installers/windows/GoatCitadel-Setup-${{ matrix.target }}.exe.sha256

  release:
    runs-on: ubuntu-latest
    needs: windows
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p artifacts/release
          pnpm dlx @cyclonedx/cyclonedx-npm --output-format json --output-file "artifacts/release/goatcitadel-${RELEASE_TAG}.cyclonedx.json"

      - name: Sign release artifacts
        run: node scripts/release/sign-release-artifacts.mjs --artifacts-dir release-artifacts

      - name: Assemble release proof ZIP
        run: |
          node scripts/release/assemble-release-package.mjs \
            --version "$RELEASE_TAG" \
            --tag "$RELEASE_TAG" \
            --artifacts-dir release-artifacts \
            --sbom-file "artifacts/release/goatcitadel-${RELEASE_TAG}.cyclonedx.json"

      - name: Write commit-bound release certificate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release/write-release-certificate.mjs \
            --version "$RELEASE_TAG" \
            --tag "$RELEASE_TAG" \
            --artifacts-dir release-artifacts \
            --proof-zip "artifacts/release/package/GoatCitadel-${RELEASE_TAG}-release-package.zip" \
            --out-file artifacts/release/release-certificate.json \
            --require-success

      - name: Upload release proof bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-proof-${{ env.RELEASE_TAG }}
          path: |
            artifacts/release/goatcitadel-${{ env.RELEASE_TAG }}.cyclonedx.json
            artifacts/release/package/*.zip
            artifacts/release/release-certificate.json

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-artifacts/**/*
            artifacts/release/goatcitadel-${{ env.RELEASE_TAG }}.cyclonedx.json
            artifacts/release/package/*.zip
            artifacts/release/release-certificate.json
