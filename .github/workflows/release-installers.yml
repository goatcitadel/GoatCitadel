name: Release Installers and Bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (for example v1.0.0)"
        required: true
        type: string
      allow_unsigned:
        description: "Allow unsigned smoke artifacts. Not public-trust proof; only manual, clearly labeled convenience assets."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  actions: read
  contents: write
  id-token: write

env:
  PNPM_VERSION: 10.31.0
  NODE_VERSION: 22

jobs:
  windows:
    runs-on: ${{ matrix.runner }}
    # SECURITY (codex finding #7): The signing secrets are intentionally
    # NOT declared at the job level. Job-level `env` is inherited by every
    # step, including `pnpm install`, `cargo` commands, and third-party
    # setup actions, any of which could be compromised (malicious
    # dependency, build script, action) and exfiltrate the cert + password.
    # We only expose `WINDOWS_SIGN_CERT_BASE64` / `WINDOWS_SIGN_CERT_PASSWORD`
    # via per-step `env:` on the two signing steps, and only check for
    # their presence (not value) in the pre-flight gate.
    env:
      WINDOWS_SIGN_CERT_BASE64_PRESENT: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 != '' }}
      WINDOWS_SIGN_CERT_PASSWORD_PRESENT: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD != '' }}
      # Public package identity publisher. It must match the Authenticode
      # certificate subject because the WinUI host embeds the same sparse
      # package identity in its executable manifest.
      GOATCITADEL_WINDOWS_MSIX_PUBLISHER: ${{ vars.WINDOWS_MSIX_PUBLISHER || 'CN=GoatCitadel' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
          - target: windows-arm64
            runner: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        run: rustup default stable-msvc

      - name: Run Windows host unit tests
        timeout-minutes: 15
        run: pnpm windows:test

      - name: Verify desktop runtime proof lane
        run: pnpm verify:desktop

      - name: Build Windows App SDK host
        run: pnpm package:windows-host --target ${{ matrix.target }}

      - name: Require signing secrets for public releases
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.allow_unsigned != 'true') && (env.WINDOWS_SIGN_CERT_BASE64_PRESENT != 'true' || env.WINDOWS_SIGN_CERT_PASSWORD_PRESENT != 'true') }}
        run: |
          echo "WINDOWS_SIGN_CERT_BASE64 and WINDOWS_SIGN_CERT_PASSWORD are required for public release installers."
          exit 1

      - name: Sign desktop executable
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.allow_unsigned != 'true') && env.WINDOWS_SIGN_CERT_BASE64_PRESENT == 'true' && env.WINDOWS_SIGN_CERT_PASSWORD_PRESENT == 'true' }}
        shell: pwsh
        env:
          # SECURITY (codex finding #7): secrets are scoped to THIS step
          # only — they are not present in env during pnpm install, cargo,
          # or third-party setup steps. SECURITY (codex finding #10): we
          # also resolve signtool via the Windows SDK install path rather
          # than `Get-Command`, so a malicious earlier step cannot plant
          # a fake signtool.exe on PATH and exfiltrate the cert+password.
          WINDOWS_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          $certName = "goatcitadel-signing-cert-$([Guid]::NewGuid()).pfx"
          $certPath = Join-Path $env:RUNNER_TEMP $certName
          try {
            [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:WINDOWS_SIGN_CERT_BASE64))
            # Resolve signtool from the Windows 10/11 SDK install path
            # rather than searching PATH (codex finding #10).
            $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $signtool = Get-ChildItem -Path $sdkRoot -Recurse -Filter 'signtool.exe' -ErrorAction Stop |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object -Property @{Expression={[Version]($_.Directory.Parent.Name)}; Descending=$true} |
              Select-Object -ExpandProperty FullName -First 1
            if (-not $signtool) { throw "signtool.exe not found in Windows SDK at $sdkRoot" }
            & $signtool sign /fd SHA256 /f $certPath /p $env:WINDOWS_SIGN_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "artifacts/installers/desktop/${{ matrix.target }}/GoatCitadel-Mission-Control-Windows.exe"
            & $signtool verify /pa "artifacts/installers/desktop/${{ matrix.target }}/GoatCitadel-Mission-Control-Windows.exe"
          } finally {
            Remove-Item -LiteralPath $certPath -Force -ErrorAction SilentlyContinue
          }

      - name: Build and sign Windows package identity
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.allow_unsigned != 'true') && env.WINDOWS_SIGN_CERT_BASE64_PRESENT == 'true' && env.WINDOWS_SIGN_CERT_PASSWORD_PRESENT == 'true' }}
        shell: pwsh
        env:
          WINDOWS_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          $certName = "goatcitadel-identity-signing-cert-$([Guid]::NewGuid()).pfx"
          $certPath = Join-Path $env:RUNNER_TEMP $certName
          try {
            [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:WINDOWS_SIGN_CERT_BASE64))
            pnpm package:windows-msix --cert-path $certPath --cert-password $env:WINDOWS_SIGN_CERT_PASSWORD
          } finally {
            Remove-Item -LiteralPath $certPath -Force -ErrorAction SilentlyContinue
          }

      - name: Build packaged bundle
        run: pnpm package:bundle --target ${{ matrix.target }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        run: pnpm package:windows --target ${{ matrix.target }}

      - name: Sign Windows installer
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.allow_unsigned != 'true') && env.WINDOWS_SIGN_CERT_BASE64_PRESENT == 'true' && env.WINDOWS_SIGN_CERT_PASSWORD_PRESENT == 'true' }}
        shell: pwsh
        env:
          # SECURITY (codex finding #7, #10): secrets scoped to this step
          # only; signtool resolved from the Windows SDK path rather than
          # PATH search.
          WINDOWS_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          $certName = "goatcitadel-signing-cert-$([Guid]::NewGuid()).pfx"
          $certPath = Join-Path $env:RUNNER_TEMP $certName
          try {
            [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:WINDOWS_SIGN_CERT_BASE64))
            $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $signtool = Get-ChildItem -Path $sdkRoot -Recurse -Filter 'signtool.exe' -ErrorAction Stop |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object -Property @{Expression={[Version]($_.Directory.Parent.Name)}; Descending=$true} |
              Select-Object -ExpandProperty FullName -First 1
            if (-not $signtool) { throw "signtool.exe not found in Windows SDK at $sdkRoot" }
            & $signtool sign /fd SHA256 /f $certPath /p $env:WINDOWS_SIGN_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "artifacts/installers/windows/GoatCitadel-Setup-${{ matrix.target }}.exe"
            & $signtool verify /pa "artifacts/installers/windows/GoatCitadel-Setup-${{ matrix.target }}.exe"
          } finally {
            Remove-Item -LiteralPath $certPath -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke install Windows installer
        shell: pwsh
        run: |
          $installer = Resolve-Path "artifacts/installers/windows/GoatCitadel-Setup-${{ matrix.target }}.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "GoatCitadel-${{ matrix.target }}"
          $install = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          $desktop = Join-Path $installDir "app/desktop/GoatCitadel-Mission-Control-Windows.exe"
          if (!(Test-Path $desktop)) { throw "Installed desktop executable was not found at $desktop" }
          $identityPackage = Join-Path $installDir "app/identity/GoatCitadel-Mission-Control-Windows-Identity.msix"
          if (Test-Path $identityPackage) {
            $identity = Get-AppxPackage GoatCitadel.MissionControl.Windows
            if (-not $identity) { throw "GoatCitadel package identity was not registered." }
            $identityManifest = (Get-AppxPackageManifest -Package $identity.PackageFullName).OuterXml
            if ($identityManifest -notmatch 'goatcitadel') { throw "Registered package identity manifest does not include goatcitadel protocol." }
          }
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (Test-Path $uninstaller) {
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)" }
          }
          if (Get-AppxPackage GoatCitadel.MissionControl.Windows) { throw "GoatCitadel package identity remained registered after uninstall." }
          if (Test-Path $desktop) { throw "Installed desktop executable remained after uninstall at $desktop" }
          if (Test-Path $installDir) {
            $remainingFiles = Get-ChildItem -LiteralPath $installDir -Recurse -Force -File -ErrorAction SilentlyContinue
            if ($remainingFiles) {
              $sample = ($remainingFiles | Select-Object -First 5 -ExpandProperty FullName) -join "`n"
              throw "Installer left files after uninstall in $installDir`n$sample"
            }
            Get-ChildItem -LiteralPath $installDir -Recurse -Force -Directory -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Remove-Item -Force -ErrorAction SilentlyContinue
            $remaining = Get-ChildItem -LiteralPath $installDir -Force -ErrorAction SilentlyContinue
            if ($remaining) {
              $sample = ($remaining | Select-Object -First 5 -ExpandProperty FullName) -join "`n"
              throw "Installer left non-empty directories after uninstall in $installDir`n$sample"
            }
          }

      - name: Write SHA-256 checksum
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $installer = "artifacts/installers/windows/GoatCitadel-Setup-${{ matrix.target }}.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          Set-Content -Path "$installer.sha256" -Value "$hash *$(Split-Path $installer -Leaf)"

      - name: Upload unsigned Windows package smoke assets
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.event.inputs.allow_unsigned == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-unsigned-package-smoke-assets
          path: |
            artifacts/installers/windows/GoatCitadel-Setup-${{ matrix.target }}.exe
            artifacts/installers/windows/GoatCitadel-Setup-${{ matrix.target }}.exe.sha256

      - name: Upload Windows release assets
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.allow_unsigned != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-release-assets
          path: |
            artifacts/installers/windows/GoatCitadel-Setup-${{ matrix.target }}.exe
            artifacts/installers/windows/GoatCitadel-Setup-${{ matrix.target }}.exe.sha256
            artifacts/installers/windows-msix/GoatCitadel-Mission-Control-Windows-Identity.msix
            artifacts/installers/windows-msix/GoatCitadel-Mission-Control-Windows-Identity.msix.sha256
            artifacts/installers/windows-msix/identity-manifest.json

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve package version
        run: |
          PACKAGE_VERSION=$(node -e "process.stdout.write(require('./package.json').version)")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Build experimental Linux bundle
        run: pnpm package:bundle --target linux-x64 --skip-desktop

      - name: Archive Linux bundle
        run: |
          mkdir -p artifacts/installers/linux
          BUNDLE="artifacts/installers/bundles/GoatCitadel-${PACKAGE_VERSION}-linux-x64"
          TAR="artifacts/installers/linux/GoatCitadel-${PACKAGE_VERSION}-linux-x64.tar.gz"
          test -d "$BUNDLE"
          tar -czf "$TAR" -C "$(dirname "$BUNDLE")" "$(basename "$BUNDLE")"
          (cd "$(dirname "$TAR")" && sha256sum "$(basename "$TAR")" > "$(basename "$TAR").sha256")

      - name: Smoke Linux bundle archive
        run: |
          TAR="artifacts/installers/linux/GoatCitadel-${PACKAGE_VERSION}-linux-x64.tar.gz"
          SMOKE_DIR="$RUNNER_TEMP/goatcitadel-linux-smoke"
          mkdir -p "$SMOKE_DIR"
          tar -xzf "$TAR" -C "$SMOKE_DIR"
          ROOT="$SMOKE_DIR/GoatCitadel-${PACKAGE_VERSION}-linux-x64"
          test -x "$ROOT/bin/goatcitadel"
          test -f "$ROOT/app/release-manifest.json"
          node -e "const m=require(process.argv[1]); if (m.platform !== 'linux' || m.arch !== 'x64' || m.experimental !== true) process.exit(1)" "$ROOT/app/release-manifest.json"
          (cd "$(dirname "$TAR")" && sha256sum -c "$(basename "$TAR").sha256")

      - name: Upload experimental Linux package smoke assets
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.allow_unsigned == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-experimental-package-smoke-assets
          path: |
            artifacts/installers/linux/GoatCitadel-${{ env.PACKAGE_VERSION }}-linux-x64.tar.gz
            artifacts/installers/linux/GoatCitadel-${{ env.PACKAGE_VERSION }}-linux-x64.tar.gz.sha256

      - name: Upload experimental Linux release assets
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.allow_unsigned != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-experimental-release-assets
          path: |
            artifacts/installers/linux/GoatCitadel-${{ env.PACKAGE_VERSION }}-linux-x64.tar.gz
            artifacts/installers/linux/GoatCitadel-${{ env.PACKAGE_VERSION }}-linux-x64.tar.gz.sha256

  macos:
    runs-on: macos-14
    env:
      MACOS_DEVELOPER_ID_CERT_BASE64_PRESENT: ${{ secrets.MACOS_DEVELOPER_ID_CERT_BASE64 != '' }}
      MACOS_DEVELOPER_ID_CERT_PASSWORD_PRESENT: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD != '' }}
      MACOS_DEVELOPER_ID_SIGNING_IDENTITY_PRESENT: ${{ secrets.MACOS_DEVELOPER_ID_SIGNING_IDENTITY != '' }}
      APPLE_ID_PRESENT: ${{ secrets.APPLE_ID != '' }}
      APPLE_TEAM_ID_PRESENT: ${{ secrets.APPLE_TEAM_ID != '' }}
      APPLE_APP_SPECIFIC_PASSWORD_PRESENT: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        run: rustup default stable

      - name: Resolve package version
        run: |
          PACKAGE_VERSION=$(node -e "process.stdout.write(require('./package.json').version)")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Require macOS notarization secrets for public release DMGs
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.allow_unsigned != 'true') && (env.MACOS_DEVELOPER_ID_CERT_BASE64_PRESENT != 'true' || env.MACOS_DEVELOPER_ID_CERT_PASSWORD_PRESENT != 'true' || env.MACOS_DEVELOPER_ID_SIGNING_IDENTITY_PRESENT != 'true' || env.APPLE_ID_PRESENT != 'true' || env.APPLE_TEAM_ID_PRESENT != 'true' || env.APPLE_APP_SPECIFIC_PASSWORD_PRESENT != 'true') }}
        run: |
          echo "MACOS_DEVELOPER_ID_CERT_BASE64, MACOS_DEVELOPER_ID_CERT_PASSWORD, MACOS_DEVELOPER_ID_SIGNING_IDENTITY, APPLE_ID, APPLE_TEAM_ID, and APPLE_APP_SPECIFIC_PASSWORD are required for public macOS notarized DMGs."
          exit 1

      - name: Import macOS Developer ID certificate
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.allow_unsigned != 'true' }}
        env:
          MACOS_DEVELOPER_ID_CERT_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_BASE64 }}
          MACOS_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/goatcitadel-macos-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/goatcitadel-macos-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_DEVELOPER_ID_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build unsigned experimental macOS DMG
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.allow_unsigned == 'true' }}
        run: pnpm package:macos --target macos-arm64

      - name: Build notarized experimental macOS DMG
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.allow_unsigned != 'true' }}
        env:
          GOATCITADEL_MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_SIGNING_IDENTITY }}
          GOATCITADEL_MACOS_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          GOATCITADEL_MACOS_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GOATCITADEL_MACOS_NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: pnpm package:macos --target macos-arm64 --notarize

      - name: Smoke macOS DMG
        run: |
          DMG="artifacts/installers/macos/GoatCitadel-${PACKAGE_VERSION}-macos-arm64.dmg"
          test -f "$DMG"
          (cd "$(dirname "$DMG")" && shasum -a 256 -c "$(basename "$DMG").sha256")
          hdiutil verify "$DMG"
          MOUNT="$RUNNER_TEMP/goatcitadel-dmg"
          mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" || true' EXIT
          test -d "$MOUNT/GoatCitadel Mission Control.app"
          hdiutil detach "$MOUNT"
          trap - EXIT

      - name: Upload unsigned macOS package smoke assets
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.allow_unsigned == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-unsigned-package-smoke-assets
          path: |
            artifacts/installers/macos/GoatCitadel-${{ env.PACKAGE_VERSION }}-macos-arm64.dmg
            artifacts/installers/macos/GoatCitadel-${{ env.PACKAGE_VERSION }}-macos-arm64.dmg.sha256

      - name: Upload experimental macOS release assets
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.allow_unsigned != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-experimental-release-assets
          path: |
            artifacts/installers/macos/GoatCitadel-${{ env.PACKAGE_VERSION }}-macos-arm64.dmg
            artifacts/installers/macos/GoatCitadel-${{ env.PACKAGE_VERSION }}-macos-arm64.dmg.sha256

  release:
    runs-on: ubuntu-latest
    needs:
      - windows
      - linux
      - macos
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.allow_unsigned != 'true' }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Verify release artifact matrix
        run: |
          test -f release-artifacts/windows-x64-release-assets/GoatCitadel-Setup-windows-x64.exe
          test -f release-artifacts/windows-x64-release-assets/GoatCitadel-Setup-windows-x64.exe.sha256
          test -f release-artifacts/windows-x64-release-assets/GoatCitadel-Mission-Control-Windows-Identity.msix
          test -f release-artifacts/windows-x64-release-assets/GoatCitadel-Mission-Control-Windows-Identity.msix.sha256
          test -f release-artifacts/windows-x64-release-assets/identity-manifest.json
          test -f release-artifacts/windows-arm64-release-assets/GoatCitadel-Setup-windows-arm64.exe
          test -f release-artifacts/windows-arm64-release-assets/GoatCitadel-Setup-windows-arm64.exe.sha256
          test -f release-artifacts/windows-arm64-release-assets/GoatCitadel-Mission-Control-Windows-Identity.msix
          test -f release-artifacts/windows-arm64-release-assets/GoatCitadel-Mission-Control-Windows-Identity.msix.sha256
          test -f release-artifacts/windows-arm64-release-assets/identity-manifest.json
          test -f release-artifacts/linux-x64-experimental-release-assets/GoatCitadel-*-linux-x64.tar.gz
          test -f release-artifacts/linux-x64-experimental-release-assets/GoatCitadel-*-linux-x64.tar.gz.sha256
          test -f release-artifacts/macos-arm64-experimental-release-assets/GoatCitadel-*-macos-arm64.dmg
          test -f release-artifacts/macos-arm64-experimental-release-assets/GoatCitadel-*-macos-arm64.dmg.sha256

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p artifacts/release
          pnpm dlx @cyclonedx/cyclonedx-npm --output-format json --output-file "artifacts/release/goatcitadel-${RELEASE_TAG}.cyclonedx.json"

      - name: Sign release artifacts
        run: node scripts/release/sign-release-artifacts.mjs --artifacts-dir release-artifacts

      - name: Assemble release proof ZIP
        run: |
          node scripts/release/assemble-release-package.mjs \
            --version "$RELEASE_TAG" \
            --tag "$RELEASE_TAG" \
            --artifacts-dir release-artifacts \
            --sbom-file "artifacts/release/goatcitadel-${RELEASE_TAG}.cyclonedx.json"

      - name: Wait for 1.0 release proof
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release/wait-for-release-proof.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --timeout-ms 14400000

      - name: Wait for direct A2A full proof
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release/wait-for-release-proof.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --workflow verification-a2a-full.yml \
            --timeout-ms 7200000

      - name: Write commit-bound release certificate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release/write-release-certificate.mjs \
            --version "$RELEASE_TAG" \
            --tag "$RELEASE_TAG" \
            --artifacts-dir release-artifacts \
            --proof-zip "artifacts/release/package/GoatCitadel-${RELEASE_TAG}-release-package.zip" \
            --out-file artifacts/release/release-certificate.json \
            --require-success

      - name: Upload release proof bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-proof-${{ env.RELEASE_TAG }}
          path: |
            artifacts/release/goatcitadel-${{ env.RELEASE_TAG }}.cyclonedx.json
            artifacts/release/package/*.zip
            artifacts/release/release-certificate.json

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-artifacts/**/*
            artifacts/release/goatcitadel-${{ env.RELEASE_TAG }}.cyclonedx.json
            artifacts/release/package/*.zip
            artifacts/release/release-certificate.json
