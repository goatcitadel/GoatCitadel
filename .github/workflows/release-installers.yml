name: Release Windows Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  PNPM_VERSION: 10.31.0
  NODE_VERSION: 24

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [windows-x64, windows-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packaged bundle
        run: pnpm package:bundle --target ${{ matrix.target }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        run: pnpm package:windows --target ${{ matrix.target }}

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $installer = "artifacts/installers/windows/GoatCitadel-Setup-${{ matrix.target }}.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          Set-Content -Path "$installer.sha256" -Value "$hash *$(Split-Path $installer -Leaf)"

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-release-assets
          path: |
            artifacts/installers/windows/GoatCitadel-Setup-${{ matrix.target }}.exe
            artifacts/installers/windows/GoatCitadel-Setup-${{ matrix.target }}.exe.sha256

  release:
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-artifacts/**/*
