name: TypeScript 7 Compiler

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/typescript-7-compiler.yml"
      - "docs/dependency-policy.md"
      - "docs/typescript-7-compiler.md"
      - "scripts/typescript/**"
      - "apps/**/package.json"
      - "apps/**/tsconfig*.json"
      - "packages/**/package.json"
      - "packages/**/tsconfig*.json"

permissions:
  contents: read

jobs:
  benchmark:
    name: TS7 Compiler Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert TypeScript toolchain
        run: pnpm ts7:toolchain

      - name: Run TS7 benchmark
        env:
          TS7_BENCHMARK_WARMUP_RUNS: "1"
          TS7_BENCHMARK_MEASURED_RUNS: "1"
        run: pnpm ts7:benchmark

      - name: Upload TS7 benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts7-compiler-benchmark-artifacts
          path: artifacts/typescript/ts7
          if-no-files-found: ignore
