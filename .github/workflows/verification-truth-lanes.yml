name: Verification Truth Lanes

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/verification/**"
      - ".github/workflows/verification-truth-lanes.yml"
      - "docs/1_0_CONTRACT.md"
      - "docs/1_0_RELEASE_EVIDENCE.md"
      - "README.md"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/verification/**"
      - ".github/workflows/verification-truth-lanes.yml"
      - "docs/1_0_CONTRACT.md"
      - "docs/1_0_RELEASE_EVIDENCE.md"
      - "README.md"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  truth-lanes:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - laneScript: verify:runtime:truth
            artifactSlug: runtime-truth
          - laneScript: verify:auth:matrix
            artifactSlug: auth-matrix
          - laneScript: verify:ui:parity
            artifactSlug: ui-parity
          - laneScript: verify:memory:truth
            artifactSlug: memory-truth
          - laneScript: verify:realtime:truth
            artifactSlug: realtime-truth
          - laneScript: verify:architecture:metrics
            artifactSlug: architecture-metrics
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run truth verification lane
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: pnpm "${{ matrix.laneScript }}"

      - name: Run review generation
        if: always()
        run: pnpm verify:review

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.artifactSlug }}-artifacts
          path: artifacts/verification
          if-no-files-found: ignore
