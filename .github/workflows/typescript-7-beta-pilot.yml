name: TypeScript 7 Beta Pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/typescript-7-beta-pilot.yml"
      - "docs/dependency-policy.md"
      - "docs/typescript-7-beta-pilot.md"
      - "scripts/typescript/**"
      - "apps/**/package.json"
      - "apps/**/tsconfig*.json"
      - "packages/**/package.json"
      - "packages/**/tsconfig*.json"

jobs:
  benchmark:
    name: Experimental TS7 Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run experimental TS7 benchmark
        run: pnpm ts7:benchmark

      - name: Upload TS7 benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts7-beta-benchmark-artifacts
          path: artifacts/typescript/ts7-beta
          if-no-files-found: ignore
