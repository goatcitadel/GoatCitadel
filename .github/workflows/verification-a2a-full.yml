name: Verification A2A Full

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/gateway/**"
      - "packages/contracts/**"
      - "packages/storage/**"
      - "docs/1_0_CONTRACT.md"
      - "docs/1_0_RELEASE_EVIDENCE.md"
      - "docs/CANONICAL_RUNTIME_STATE_MODEL.md"
      - "scripts/verification/**"
      - "scripts/verify-artifact-redaction.mjs"
      - "scripts/verify-artifact-redaction.test.mjs"
      - ".github/workflows/verification-a2a-full.yml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - "apps/gateway/**"
      - "packages/contracts/**"
      - "packages/storage/**"
      - "docs/1_0_CONTRACT.md"
      - "docs/1_0_RELEASE_EVIDENCE.md"
      - "docs/CANONICAL_RUNTIME_STATE_MODEL.md"
      - "scripts/verification/**"
      - "scripts/verify-artifact-redaction.mjs"
      - "scripts/verify-artifact-redaction.test.mjs"
      - ".github/workflows/verification-a2a-full.yml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  a2a-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run A2A full verification
        run: pnpm verify:a2a:full

      - name: Verify artifact redaction
        id: artifact-redaction
        if: always()
        run: pnpm verify:artifacts:redaction

      - name: Upload verification artifacts
        if: always() && steps.artifact-redaction.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: verification-a2a-full-artifacts
          path: artifacts/verification
          if-no-files-found: error
