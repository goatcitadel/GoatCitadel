name: Visual Rebaseline (manual)

# One-shot maintenance workflow: regenerates the Mission Control Next visual
# baselines on the Ubuntu CI renderer (the only environment whose font/AA output
# matches the verification lane) and opens a PR with the refreshed PNGs.
# Trigger from the Actions tab or: gh workflow run visual-rebaseline.yml --ref main
# Scope to specific routes/variants to keep the diff small, e.g.:
#   gh workflow run visual-rebaseline.yml --ref main -f route_slugs=settings-general

on:
  workflow_dispatch:
    inputs:
      route_slugs:
        description: "Comma-separated visual route slugs to rebaseline (empty = all routes)"
        required: false
        default: ""
      variant_slugs:
        description: "Comma-separated visual variant slugs to rebaseline (empty = all variants)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  visual-rebaseline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Regenerate visual baselines
        env:
          GOATCITADEL_UI_PACKAGE: "@goatcitadel/mission-control-next"
          GOATCITADEL_VERIFY_VISUAL_ROUTE_SLUGS: ${{ inputs.route_slugs }}
          GOATCITADEL_VERIFY_VISUAL_VARIANT_SLUGS: ${{ inputs.variant_slugs }}
        run: pnpm verify:visual:rebaseline

      # TEMP DIAGNOSTIC (docs-check-citadel): the rebaseline lane writes failure
      # detail only to the on-runner artifacts dir, which is otherwise discarded.
      # Surface it inline + upload it so capture failures are debuggable.
      - name: Surface rebaseline diagnostics
        if: always()
        run: |
          set +e
          ROOT="$(ls -dt artifacts/verification/*/ 2>/dev/null | head -1)"
          echo "ARTIFACT ROOT: ${ROOT:-<none>}"
          if [ -z "${ROOT:-}" ]; then echo "no artifact root produced"; exit 0; fi
          echo "=== directory tree (depth 2) ==="
          find "$ROOT" -maxdepth 2 | sort
          echo "=== route-ready-failure diagnostics (readyError + shell area/section) ==="
          for f in "$ROOT"diagnostics/*route-ready-failure*.json; do
            [ -e "$f" ] || continue
            echo "----- $f -----"; cat "$f"; echo
          done
          echo "=== json files mentioning citadel / failed / console-or-page errors ==="
          grep -rilE "library-citadel|\"status\":\s*\"failed\"|console errors|page errors" "$ROOT" --include=*.json | head -40
          echo "=== contents of failed-scenario json (first 6KB each) ==="
          for f in $(grep -rilE "\"status\":\s*\"failed\"|route ready wait timed out|console errors|page errors" "$ROOT" --include=*.json | head -20); do
            echo "----- $f -----"; head -c 6000 "$f"; echo
          done
          echo "=== citadel console snapshots ==="
          for f in "$ROOT"playwright/*citadel*.json; do
            [ -e "$f" ] || continue
            echo "----- $f -----"; head -c 5000 "$f"; echo
          done
          echo "=== diagnostics dump complete ==="
          exit 0

      - name: Upload rebaseline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebaseline-diagnostics
          path: artifacts/verification
          retention-days: 5
          if-no-files-found: ignore

      - name: Open rebaseline PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/verification/baselines/visual; then
            echo "No baseline changes produced; nothing to do."
            exit 0
          fi
          BRANCH="chore/visual-rebaseline-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add scripts/verification/baselines/visual
          git commit -m "chore(verification): refresh mc-next visual baselines"
          git push origin "$BRANCH"
          SCOPE_ROUTES="${{ inputs.route_slugs }}"
          SCOPE_VARIANTS="${{ inputs.variant_slugs }}"
          gh pr create --base main --head "$BRANCH" --title "chore(verification): refresh visual baselines (mc-next)" --body "Automated rebaseline run ${GITHUB_RUN_ID}. Scope: routes=[${SCOPE_ROUTES:-all}] variants=[${SCOPE_VARIANTS:-all}]. Review the image diff before merging."
