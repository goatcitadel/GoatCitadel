name: Visual Rebaseline (manual)

# One-shot maintenance workflow: regenerates the Mission Control Next visual
# baselines on the Ubuntu CI renderer (the only environment whose font/AA output
# matches the verification lane) and opens a PR with the refreshed PNGs.
# Trigger from the Actions tab or: gh workflow run visual-rebaseline.yml --ref main

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  visual-rebaseline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Regenerate visual baselines
        env:
          GOATCITADEL_UI_PACKAGE: "@goatcitadel/mission-control-next"
        run: pnpm verify:visual:rebaseline

      - name: Open rebaseline PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/open-visual-rebaseline-pr.sh
