# Narrow exclusion list. Do NOT broaden this to all test files: a real
# credential pasted into a future integration test must still trigger an
# alert. Add a new entry only after verifying the file contains synthetic
# placeholders that cannot match a real secret in production traffic.
paths-ignore:
  # Synthetic shaped-token fixtures that exercise the secret-redaction
  # function. Reviewed 2026-05-18 — every match is a deliberately-fake
  # placeholder (Telegram bot token shape, sk-proj-, ghp_, AKIA…).
  - "apps/gateway/src/services/improvement-common.redaction.security.test.ts"
  # Dedicated fixture/snapshot directories — conventionally non-production
  # test data only.
  - "**/__fixtures__/**"
  - "**/__snapshots__/**"
